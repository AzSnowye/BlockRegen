# ---------------------------------------------------------------------------------------------------- #
#                                      BlockRegen Configuration                                      #
# ---------------------------------------------------------------------------------------------------- #
# This file defines custom block regeneration behaviors, including drops, sounds, particles,           #
# tool requirements, and commands. Each top-level key is now a config ID (e.g., floor1, ore_main,      #
# boss_rock), while the actual block that appears in-game is defined with `Block:`.                    #
#                                                                                                      #
# IMPORTANT: `Block:` should contain the real block ID or material that exists in the world           #
# (e.g., STONE, itemsadder:custom_ore, nexo:nexo_ore). For MMOItems drops/tools, keep using           #
# the 'mmoitems:TYPE:ID' format. For Nexo, use the 'nexo:id' format.                                   #
# Optional per-block region restriction: use `regions:` list (example at section #13).                 #
# ---------------------------------------------------------------------------------------------------- #

# Example new format:
# floor1:
#   Block: STONE
#   replaced-block: COBBLESTONE
#   regen-delay: 10
#   natural-drop: true


# ==================================================================================================== #
#                                       EXAMPLE CONFIGURATIONS                                       #
# ==================================================================================================== #


# ─────────────────────────────────────────────────────────────────────────── #
# MODE BARU: BLOCK HEALTH (HP-based Mining)                                    #
# Setiap klik kanan mengurangi HP = pickaxe power pemain.                     #
# Contoh: health 100, power 5 → butuh 20 klik. Power 25 → butuh 4 klik.      #
# Aktifkan dengan menambahkan 'block-health: <nilai>' pada blok di bawah.     #
# ─────────────────────────────────────────────────────────────────────────── #
# IRON_ORE:
#   replaced-block: STONE
#   regen-delay: 15
#   natural-drop: true
#   block-health: 50                  # HP maksimal blok ini
#   require-pickaxe-power: 5          # Minimum power yang bisa damage blok ini
#   break-sound: "BLOCK_STONE_HIT:0.6:1.0"

# ═════════════════════════════════════════════════════════════════════════ #
#                    EXAMPLE: HEALTH MODE BLOCKS                           #
#                    (HP-based Mining Mechanic)                            #
# ═════════════════════════════════════════════════════════════════════════ #

# ─────────────────────────────────────────────────────────────────────────── #
# EXAMPLE 1: Basic Health Block (Emerald Ore)                                 #
#            Simple health mode block dengan hologram health bar.             #
# ─────────────────────────────────────────────────────────────────────────── #
# EMERALD_ORE:
#   replaced-block: STONE
#   regen-delay: 20
#   block-health: 80
#   require-pickaxe-power: 10  # Minimum pickaxe power to damage
#   drops:
#     auto-inventory: false
#     natural-drop: true
#   sounds:
#     break-sound: ENTITY_ITEM_PICKUP
#     regen-sound: BLOCK_NOTE_BLOCK_CHIME
#   particles:
#     break-particle: CRIT_MAGIC
#     regen-particle: SOUL_FIRE_FLAME

# ─────────────────────────────────────────────────────────────────────────── #
# EXAMPLE 2: Health Block dengan Custom Drops                                 #
#            Health mode block yang hanya drop item custom saat hancur.        #
# ─────────────────────────────────────────────────────────────────────────── #
# DIAMOND_ORE:
#   replaced-block: BEDROCK
#   regen-delay: 30
#   block-health: 150            # Butuh dipukul lebih banyak
#   require-pickaxe-power: 20
#   exp-drop-amount: '5-10'
#   drops:
#     auto-inventory: false
#     natural-drop: false         # Tidak drop bawaan minecraft
#   custom-drops:
#     diamond_shard:
#       chance: 100.0
#       amount: '1-3'
#       material: DIAMOND
#       name: '&b&lBermuda Diamond'
#       lore:
#         - '&7Mined from deep in the earth.'
#   mmocore-exp:
#     mining: 25
#   auraskills-xp:
#     mining: 20
#   sounds:
#     break-sound: BLOCK_AMETHYST_CLUSTER_BREAK
#     regen-sound: BLOCK_BEACON_POWER_SELECT

# ─────────────────────────────────────────────────────────────────────────── #
# EXAMPLE 3: Health Block dengan MMOItems Tool Requirement                    #
#            Hanya bisa dipecah dengan tool MMOItems tertentu.                 #
# ─────────────────────────────────────────────────────────────────────────── #
LAPIS_ORE:
  replaced-block: STONE
  regen-delay: 15
  block-health: 100
  tools-required:
    - mmoitems:PICKAXE:MYTHIC_PICKAXE
    - mmoitems:PICKAXE:LEGENDARY_PICKAXE
    - NETHERITE_PICKAXE
  drops:
    auto-inventory: true       # Auto-inventory untuk drops
    natural-drop: false
  custom-drops:
    lapis_dust:
      chance: 100.0
      amount: '2-5'
      material: LAPIS_LAZULI
      name: '&9&lLapis Dust'
  exp-drop-amount: '3-6'

# ─────────────────────────────────────────────────────────────────────────── #
# EXAMPLE 4: Health Block dengan Region Restriction                           #
#            Block ini hanya regen di region tertentu.                         #
# ─────────────────────────────────────────────────────────────────────────── #
# ANCIENT_DEBRIS:
#   replaced-block: NETHERRACK
#   regen-delay: 45
#   block-health: 200            # Sangat tahan lama
#   require-pickaxe-power: 40
#   regions:
#     - mining_zone_nether       # Hanya regen di region ini
#   exp-drop-amount: '10-20'
#   drops:
#     auto-inventory: false
#     natural-drop: false
#   custom-drops:
#     netherite_scrap:
#       chance: 100.0
#       amount: '1-2'
#       material: NETHERITE_SCRAP
#       name: '&f&lNetherite Scrap Fragment'
#       lore:
#         - '&7Rare material from the Nether'
#   sounds:
#     break-sound: ENTITY_WITHER_DEATH
#     regen-sound: BLOCK_NETHER_ORE_BREAK
#   particles:
#     break-particle: ASH
#     regen-particle: SOUL_FIRE_FLAME

# ─────────────────────────────────────────────────────────────────────────── #
# EXAMPLE 5: Nexo Health Block (Health Mode)                                  #
#            Custom block dari Nexo dengan health-based mining.                #
# ─────────────────────────────────────────────────────────────────────────── #
# 'nexo:celestial_ore':
#   replaced-block: STONE
#   regen-delay: 60
#   block-health: 250            # Sangat tangguh
#   require-pickaxe-power: 50
#   regions:
#     - celestial_mining_zone
#   exp-drop-amount: '15-25'
#   drops:
#     auto-inventory: true
#     natural-drop: false
#   custom-drops:
#     celestial_gem:
#       chance: 100.0
#       amount: '1'
#       material: 'nexo:celestial_gem'
#       name: '&d&lCelestial Gem'
#   regen-blocks:
#     'nexo:celestial_ore':
#       chance: 80.0
#     'nexo:celestial_stone':
#       chance: 20.0
#   mmocore-exp:
#     mining: 40
#   auraskills-xp:
#     mining: 35
#   sounds:
#     break-sound: BLOCK_AMETHYST_CLUSTER_BREAK
#     regen-sound: ENTITY_LIGHTNING_BOLT_THUNDER

# ─────────────────────────────────────────────────────────────────────────── #
# MODE PROGRESSIVE REGEN (HYPIXEL STYLE)                                      #
# Blok berganti tahap demi tahap seperti di Hypixel Skyblock.                 #
# Contoh: STONE dihancurkan -> COBBLESTONE -> dihancurkan -> BEDROCK          #
# Kemudian dari BEDROCK akan regen kembali menjadi STONE.                     #
# ─────────────────────────────────────────────────────────────────────────── #
# STONE:
#   replaced-block: COBBLESTONE
#   regen-delay: -1 # Delay -1 berarti tidak akan regen otomatis, menunggu ditambang lagi
#   drops:
#     auto-inventory: false
#     natural-drop: false
#   custom-drops:
#     cobble_drop:
#       chance: 100.0
#       amount: '1'
#       material: COBBLESTONE
#
# COBBLESTONE:
#   replaced-block: BEDROCK
#   regen-delay: 5 # Akan regen kembali ke STONE dalam 5 detik
#   regen-blocks:
#     STONE:
#       chance: 100.0
#   drops:
#     auto-inventory: false
#     natural-drop: false
#   custom-drops:
#     stone_drop:
#       chance: 100.0
#       amount: '1'
#       material: STONE

# ─────────────────────────────────────────────────────────────────────────── #
# 1. BASIC VANILLA ORE (COAL_ORE)                                                                      #
#    - Simple regeneration with natural drop enabled.                                                  #
#    - NEW FEATURE DEMO: Custom Breaking Speed                                                         #
# ---------------------------------------------------------------------------------------------------- #
COAL_ORE:
  replaced-block: STONE
  regen-delay: 5

  # --- CUSTOM BREAKING SPEED (NEW) ---
  # The custom time (in seconds) required to break this block.
  # Set to 0 or remove this line to use vanilla speed.
  break-duration: 3.0

  # If 'true', the 'break-duration' above is ABSOLUTE.
  # It will ignore ALL speed bonuses from:
  # 1. Vanilla Enchants (Efficiency)
  # 2. Potion Effects (Haste)
  # 3. Plugin Stats (Including MMOItems Mining Speed)
  #
  # If 'false', 'break-duration' will be the base time, which CAN be sped up.
  # (Currently ONLY 'true' is fully supported)
  fixed-duration: true
  # --- END NEW FEATURE ---

  exp-drop-amount: '1-2' # Drops 1 to 2 experience points
  auto-pickup-exp: true # If true, EXP is given directly to the player. If false, it drops as an orb.
  drops:
    auto-inventory: false
    natural-drop: true
  fortune:
    enabled: true
    multiplier:
      1: 1.2  # Fortune I: drop amount multiplied by 1.2
      2: 1.5  # Fortune II: drop amount multiplied by 1.5
      3: 2.0  # Fortune III: drop amount multiplied by 2.0


# ---------------------------------------------------------------------------------------------------- #
# 2. CUSTOM DROP ORE (IRON_ORE)                                                                        #
#    - Natural drop disabled, only custom vanilla drops.                                               #
# ---------------------------------------------------------------------------------------------------- #
IRON_ORE:
  replaced-block: STONE
  regen-delay: 8
  exp-drop-amount: '1-3' # Drops 1 to 3 experience points
  auto-pickup-exp: true # If true, EXP is given directly to the player. If false, it drops as an orb.
  drops:
    auto-inventory: false
    natural-drop: false # Disable natural drop
  custom-drops:
    iron_ingot_drop:
      chance: 100.0
      amount: '1-2'
      material: IRON_INGOT
      name: '&f&lRefined Iron'
      lore:
        - '&7A specially processed iron ingot.'


# ---------------------------------------------------------------------------------------------------- #
# 3. ITEMSADDER ORE (GOLD_ORE)                                                                         #
#    - Custom drop with an ItemsAdder item.                                                            #
# ---------------------------------------------------------------------------------------------------- #
GOLD_ORE:
  replaced-block: STONE
  regen-delay: 12
  exp-drop-amount: '2-4' # Drops 2 to 4 experience points
  drops:
    auto-inventory: false
    natural-drop: false
  custom-drops:
    itemsadder_gold_coin:
      chance: 80.0
      amount: '1'
      material: 'itemsadder:gold_coin' # ItemsAdder item
      # Name and lore are optional for ItemsAdder items.


# ---------------------------------------------------------------------------------------------------- #
# 4. MMOITEMS ORE (DIAMOND_ORE)                                                                        #
#    - Custom drop with an MMOItems item.                                                              #
# ---------------------------------------------------------------------------------------------------- #
DIAMOND_ORE:
  replaced-block: BEDROCK
  regen-delay: 15
  exp-drop-amount: '3-7' # Drops 3 to 7 experience points
  drops:
    auto-inventory: false
    natural-drop: false
  custom-drops:
    mmoitems_legendary_pickaxe:
      chance: 10.0
      amount: '1'
      material: 'mmoitems:PICKAXE:LEGENDARY_PICKAXE' # MMOItems item (TYPE:ID)
  mmocore-exp:
    mining: 15 # Gives 15 EXP to the MMOCore 'mining' profession
    # Name and lore are optional for MMOItems.
  auraskills-xp:
    mining: 15 # Gives 15 AuraSkills XP to the mining skill



# ---------------------------------------------------------------------------------------------------- #
# 5. TOOL REQUIREMENT ORE (EMERALD_ORE)                                                                #
#    - Requires a specific tool to break.                                                              #
# ---------------------------------------------------------------------------------------------------- #
EMERALD_ORE:
  replaced-block: STONE
  regen-delay: 20
  tools-required:
    - DIAMOND_PICKAXE
    - NETHERITE_PICKAXE # Only these tools can break it
  exp-drop-amount: '3-7' # Drops 3 to 7 experience points
  drops:
    auto-inventory: false
    natural-drop: true


# ---------------------------------------------------------------------------------------------------- #
# 6. SOUND & PARTICLE ORE (LAPIS_ORE)                                                                  #
#    - Custom sounds and particles on break and regen.                                                 #
# ---------------------------------------------------------------------------------------------------- #
LAPIS_ORE:
  replaced-block: STONE
  regen-delay: 10
  exp-drop-amount: '2-5' # Drops 2 to 5 experience points
  drops:
    auto-inventory: false
    natural-drop: true
  sounds:
    break-sound: ENTITY_PLAYER_LEVELUP # Custom break sound
    regen-sound: BLOCK_NOTE_BLOCK_PLING # Custom regen sound
  particles:
    break-particle: EXPLOSION_LARGE # Custom break particle
    regen-particle: HEART # Custom regen particle


# ---------------------------------------------------------------------------------------------------- #
# 7. COMMAND ORE (REDSTONE_ORE)                                                                        #
#    - Executes commands when broken.                                                                  #
# ---------------------------------------------------------------------------------------------------- #
REDSTONE_ORE:
  replaced-block: STONE
  regen-delay: 7
  exp-drop-amount: '1-5' # Drops 1 to 5 experience points
  drops:
    auto-inventory: false
    natural-drop: true
  commands:
    - '[CONSOLE] give %player% experience 100' # Give player 100 XP
    - '[PLAYER] msg %player% You found a special Redstone Ore!' # Send player a message
    - '[OP] effect give %player% speed 5 2' # Temporarily give speed effect


# ---------------------------------------------------------------------------------------------------- #
# 8. FULL FEATURED ORE (ANCIENT_DEBRIS)                                                                #
#    - Combines multiple features: custom drops, tool requirement, sounds, particles, and commands.    #
# ---------------------------------------------------------------------------------------------------- #
ANCIENT_DEBRIS:
  replaced-block: NETHERRACK
  regen-delay: 30
  tools-required:
    - NETHERITE_PICKAXE
    - DIAMOND_PICKAXE:
        name: "&bSuper Pickaxe"
        lore:
          - "&7very rare pickaxe."
  exp-drop-amount: '5-10' # Drops 5 to 10 experience points
  drops:
    auto-inventory: true # Auto-inventory enabled
    natural-drop: false
  custom-drops:
    netherite_scrap_drop:
      chance: 50.0
      amount: '1'
      material: NETHERITE_SCRAP
      name: '&d&lMystical Scrap'
      lore:
        - '&7A fragment of ancient power.'
    itemsadder_ancient_relic:
      chance: 5.0
      amount: '1'
      material: 'itemsadder:ancient_relic'
    mmoitems_ancient_artifact:
      chance: 1.0
      amount: '1'
      material: 'mmoitems:ARTIFACT:ANCIENT_ARTIFACT'
  sounds:
    break-sound: ENTITY_WITHER_DEATH
    regen-sound: ENTITY_WITHER_SPAWN
  particles:
    break-particle: ASH
    regen-particle: SOUL_FIRE_FLAME
  commands:
    - '[CONSOLE] broadcast %player% has found an ANCIENT DEBRIS!'
    - '[PLAYER] title %player% title &6&lTREASURE FOUND!'
    - '[OP] give %player% diamond 1'


# ---------------------------------------------------------------------------------------------------- #
# 9. AUTO INVENTORY ORE (QUARTZ_ORE)                                                                   #
